<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>My Game MIDI Hub</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 30px; }
    .card { background: #1e1e1e; padding: 15px; margin: 15px auto; max-width: 500px; border-radius: 10px; border: 1px solid #333; }
    button { background: #00c853; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🎹 My Neverland MIDI Library</h1>
  <p>Niche diye gaye button se direct .mid link copy karein:</p>

  <div class="card">
    <h3>Doraemon Theme</h3>
    <button onclick="copyLink('doraemon.mid')">Copy Direct .mid Link</button>
  </div>

  <script>
    function copyLink(fileName) {
      const fullUrl = window.location.origin + window.location.pathname.replace('index.html', '') + fileName;
      navigator.clipboard.writeText(fullUrl);
      alert("Link copy ho gaya! Ab game mein paste karein:\n" + fullUrl);
    }
  </script>
</body>
</html>
